<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Hacking Prank (Fake Terminal)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --green:#00ff66; }
    html, body { margin:0; height:100%; background:#000; color:var(--green); font-family: monospace; }
    .wrap { padding:20px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .badge { border:1px solid var(--green); padding:6px 10px; box-shadow:0 0 8px var(--green); }
    .terminal { border:1px solid var(--green); padding:16px; min-height:50vh; box-shadow:0 0 14px var(--green); overflow:auto; }
    .controls { margin-top:12px; display:flex; gap:10px; }
    .btn { padding:10px 16px; background:var(--green); color:#000; font-weight:bold; border:none; cursor:pointer; }
    .btn:hover { background:#000; color:var(--green); border:1px solid var(--green); }
    .progress { margin-top:10px; height:10px; border:1px solid var(--green); }
    .bar { height:100%; width:0%; background:var(--green); box-shadow:0 0 10px var(--green); transition:width .2s linear; }
    .warn { color:#000; background:var(--green); font-weight:bold; padding:6px 10px; display:inline-block; margin-top:10px; }
    .dim { opacity:.7; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="badge">FAKE‑TERMINAL v1.0</div>
      <div class="badge dim">Demo‑Modus aktiv</div>
    </div>

    <div class="terminal" id="term" aria-live="polite"></div>

    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="controls">
      <button class="btn" id="start">▶ Start</button>
      <button class="btn" id="fullscreen">⛶ Fullscreen</button>
      <button class="btn" id="back" onclick="location.href='index.html'">← Zurück</button>
    </div>
    <div class="warn">Hinweis: Rein visuelle Demo. Es passiert nichts außerhalb dieser Seite.</div>
  </div>

  <audio id="beep" preload="auto">
    <source src="data:audio/wav;base64,UklGRiIAAABXQVZFZm10IBAAAAABAAEAESsAABErAAACABAAZGF0YQAAAAA=" type="audio/wav">
  </audio>

  <script>
    const term = document.getElementById("term");
    const bar = document.getElementById("bar");
    const startBtn = document.getElementById("start");
    const fsBtn = document.getElementById("fullscreen");
    const beep = document.getElementById("beep");

    const script = [
      "> Initialisiere Netzwerk‑Scan...",
      "portscan --target=demo.local --range=1-65535",
      "[✓] Ports gefunden: 22, 80, 443, 8080",
      "> Sammle Fingerprints...",
      "fingerprint --services --tls --cdn",
      "[✓] TLS Fingerprint simuliert",
      "> Versuche Demo‑Login...",
      "auth --method=token --user=guest",
      "[✓] Demo‑Token akzeptiert",
      "> Lade „geheime“ Daten…",
      "pull --source=demo://cache --size=128MB",
      "[✓] Datenfluss stabil",
      ">>> DEMO‑SYSTEM: ZUGRIFF ERTEILT <<<",
      "> Starte visuelle Matrix...",
      "render --effect=code‑rain --intensity=high",
      "[✓] Effekt aktiv",
      ">>> ENDE: Nur eine Show. Alles ist lokal und harmlos. <<<"
    ];

    let i = 0;
    let running = false;

    function append(line){
      term.insertAdjacentHTML("beforeend", line + "<br>");
      term.scrollTop = term.scrollHeight;
      try { beep.currentTime = 0; beep.play(); } catch(e){}
    }

    function progress(p){ bar.style.width = p + "%"; }

    async function run(){
      if(running) return;
      running = true;
      startBtn.disabled = true;

      for(i=0; i<script.length; i++){
        append(script[i]);
        progress(Math.min(100, Math.floor(((i+1)/script.length)*100)));
        await new Promise(r => setTimeout(r, 600 + Math.random()*400));
      }

      // Fake Alarmrahmen kurz einschalten
      document.body.style.boxShadow = "inset 0 0 60px #00ff66";
      setTimeout(()=>document.body.style.boxShadow = "none", 1500);
    }

    startBtn.addEventListener("click", run);

    fsBtn.addEventListener("click", async ()=>{
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        try { await el.requestFullscreen(); } catch(e){}
      } else {
        try { await document.exitFullscreen(); } catch(e){}
      }
    });

    // Auto‑Start nach Tastendruck
    addEventListener("keydown", (e)=>{
      if(!running) run();
    });
  </script>
</body>
</html>
