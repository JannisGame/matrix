<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Network Hacking</title>
  <style>
    body {
      background: black;
      color: #00ff66;
      font-family: monospace;
      padding: 20px;
    }
    .terminal {
      border: 1px solid #00ff66;
      padding: 20px;
      box-shadow: 0 0 10px #00ff66;
      min-height: 300px;
    }
    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #00ff66;
      color: black;
      font-weight: bold;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 10px #00ff66;
    }
    .btn:hover {
      background: black;
      color: #00ff66;
      border: 1px solid #00ff66;
    }
  </style>
</head>
<body>
  <h1>Network Hacking</h1>
  <div class="terminal" id="output"></div>
  <button class="btn" onclick="location.href='index.html'">← Zurück zur Matrix</button>

  <script>
    const output = document.getElementById("output");
    const lines = [
      "Starte Netzwerk-Scan...",
      "Scanne IP-Bereich: 235.824.0.4 - 235.845.0.768",
      "[✓] Host gefunden: 749.390.0.95",
      "Prüfe offene Ports...",
      "[✓] Ports offen: 22, 80, 443",
      "Simuliere Zugriff...",
      ">>> NETZWERK 'GEHACKT' <<<",
      
    ];
    let i = 0;

    function typeLine() {
      if (i < lines.length) {
        output.innerHTML += lines[i] + "<br>";
        i++;
        setTimeout(typeLine, 1000);
      }
    }
    typeLine();
  </script>
</body>
</html>
